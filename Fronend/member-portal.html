<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Cổng Hội Viên - GYM PRO MANAGEMENT</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#"
          >GYM <span class="text-warning">MEMBER</span></a
        >
        <div class="d-flex align-items-center">
          <span class="text-white me-3 fw-medium" id="tenHoiVien"
            >Đang tải thông tin...</span
          >
          <button
            class="btn btn-outline-light btn-sm fw-bold rounded-pill px-3"
            onclick="dangXuat()"
          >
            Đăng xuất
          </button>
        </div>
      </div>
    </nav>

    <div class="container mt-5">
      <div class="row">
        <div class="col-md-4 mb-4">
          <div
            class="card border-0 shadow-sm border-top border-success border-4 h-100 rounded-3"
          >
            <div class="card-body text-center py-5">
              <h6 class="text-muted fw-bold mb-4">GÓI TẬP HIỆN TẠI CỦA BẠN</h6>
              <h3 class="text-success fw-bold my-3" id="tenGoiTap">
                <span
                  class="spinner-border spinner-border-sm"
                  role="status"
                  aria-hidden="true"
                ></span>
                Đang tải...
              </h3>
              <p class="mb-1 text-secondary mt-4">Ngày hết hạn:</p>
              <h4 class="text-danger fw-bold mb-4" id="ngayHetHan">
                --/--/----
              </h4>

              <hr class="my-4 w-75 mx-auto" />
              <button
                class="btn btn-warning fw-bold w-100 text-dark shadow-sm py-2"
                onclick="moFormBaoLuu()"
              >
                Yêu cầu bảo lưu thẻ
              </button>
            </div>
          </div>
        </div>

        <div class="col-md-8 mb-4">
          <div class="card border-0 shadow-sm h-100 rounded-3">
            <div class="card-header bg-white py-3 border-bottom-0">
              <h6 class="mb-0 fw-bold text-primary">
                <i class="bi bi-clock-history me-2"></i>LỊCH SỬ RA VÀO
                (CHECK-IN)
              </h6>
            </div>
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead
                    class="table-light text-secondary"
                    style="font-size: 14px"
                  >
                    <tr>
                      <th class="ps-4 border-0">Thời gian (Ngày & Giờ)</th>
                      <th class="border-0">Thao tác</th>
                      <th class="border-0 text-center">Trạng thái</th>
                    </tr>
                  </thead>
                  <tbody id="bangCheckInKhach">
                    <tr>
                      <td colspan="3" class="text-center py-5 text-muted">
                        <span
                          class="spinner-border spinner-border-sm text-success"
                          role="status"
                        ></span>
                        Đang tải dữ liệu ra vào...
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./assets/js/api.js"></script>
    <script src="./assets/js/api.js"></script>
    <script>
      function kiemTraQuyenKhach() {
        const role = localStorage.getItem("userRole");
        if (!role) {
          window.location.href = "login.html";
        } else if (role !== "Member") {
          window.location.href = "index.html";
        }
      }
      kiemTraQuyenKhach();

      function dangXuat() {
        localStorage.clear();
        window.location.href = "login.html";
      }

      async function taiDuLieuCaNhan() {
        const memberId = localStorage.getItem("memberId");
        if (!memberId) {
          alert("Lỗi: Không tìm thấy ID Hội viên!");
          return;
        }

        try {
          const resMember = await callApi("/Member/" + memberId, "GET");
          const elTen = document.getElementById("tenHoiVien");

          if (resMember && resMember.status === 200 && resMember.data) {
            const info = resMember.data.data || resMember.data;
            elTen.innerText = "Xin chào, " + (info.full_name || "Hội viên");
          } else {
            elTen.innerText = "Xin chào, Hội viên";
          }

          const resSub = await callApi(
            "/Subscription/Member/" + memberId,
            "GET",
          );
          const elTenGoi = document.getElementById("tenGoiTap");
          const elHan = document.getElementById("ngayHetHan");

          if (resSub && (resSub.status === 200 || resSub.status === 204)) {
            let danhSachThe = resSub.data
              ? resSub.data.data || resSub.data
              : [];
            if (!Array.isArray(danhSachThe))
              danhSachThe = danhSachThe ? [danhSachThe] : [];

            if (danhSachThe.length > 0) {
              const theHienTai = danhSachThe[danhSachThe.length - 1];
              elTenGoi.innerText =
                theHienTai.package_name || "Gói tập mặc định";
              elHan.innerText = theHienTai.end_date
                ? theHienTai.end_date.split("T")[0]
                : "Không xác định";

              if (theHienTai.status && theHienTai.status.includes("Frozen")) {
                elHan.innerText += " (Đang bảo lưu)";
                elHan.className = "text-warning fw-bold mb-4";
              }
            } else {
              elTenGoi.innerText = "Chưa đăng ký gói";
              elHan.innerText = "--/--/----";
            }
          } else {
            elTenGoi.innerText = "Không có dữ liệu";
            elHan.innerText = "--/--/----";
          }

          const resCheckIn = await callApi(
            "/CheckIn/History/" + memberId,
            "GET",
          );
          const tbody = document.getElementById("bangCheckInKhach");
          tbody.innerHTML = "";

          if (resCheckIn && resCheckIn.status === 200 && resCheckIn.data) {
            let lichSu = resCheckIn.data.data || resCheckIn.data;
            if (!Array.isArray(lichSu)) lichSu = [];

            if (lichSu.length === 0) {
              tbody.innerHTML =
                "<tr><td colspan='3' class='text-center py-5 text-muted'>Bạn chưa có lượt Check-in nào tại phòng tập.</td></tr>";
            } else {
              lichSu.slice(0, 10).forEach((log) => {
                const timeStr = log.checkin_time
                  ? new Date(log.checkin_time).toLocaleString("vi-VN")
                  : "Vừa xong";
                tbody.innerHTML += `
                            <tr>
                                <td class="ps-4 fw-bold text-secondary">${timeStr}</td>
                                <td>Quét mã QR</td>
                                <td class="text-center"><span class="badge bg-success-subtle text-success px-3 py-1 rounded-pill">Thành công</span></td>
                            </tr>
                        `;
              });
            }
          } else {
            tbody.innerHTML =
              "<tr><td colspan='3' class='text-center py-5 text-muted'>Chưa có dữ liệu lịch sử quẹt thẻ.</td></tr>";
          }
        } catch (error) {
          console.error("Lỗi khi tải dữ liệu:", error);
          document.getElementById("tenHoiVien").innerText =
            "Xin chào, Hội viên";
          document.getElementById("bangCheckInKhach").innerHTML =
            "<tr><td colspan='3' class='text-center py-5 text-danger'>Lỗi kết nối đến máy chủ.</td></tr>";
        }
      }

      function moFormBaoLuu() {
        alert(
          "Chức năng tự yêu cầu bảo lưu thẻ đang được hệ thống nâng cấp. Vui lòng liên hệ trực tiếp Lễ tân tại quầy để được hỗ trợ nhé!",
        );
      }

      taiDuLieuCaNhan();
    </script>
  </body>
</html>
